<app-header [title]="ruta ? 'Editar ruta' : 'Agregar ruta'" [isModal]="true" />

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <custom-input [control]="form.controls.nombre" type="text" label="Nombre" autocomplete="off" />

    <ion-item class="custom-input" lines="none">
      <ion-select
        label="País"
        interface="alert"
        formControlName="pais"
        [interfaceOptions]="{ header: 'País', cssClass: 'sa-select-alert' }">
        <ion-select-option *ngFor="let country of countries" [value]="country">
          {{ country }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <custom-input [control]="form.controls.ciudad" type="text" label="Ciudad" autocomplete="off" />

    <ion-item class="custom-input" lines="none">
      <ion-toggle [enableOnOffLabels]="true" formControlName="autoOpen">
        Apertura de caja automática
      </ion-toggle>
    </ion-item>

    <ion-item class="custom-input" lines="none">
      <ion-select
        label="Zona horaria"
        interface="alert"
        formControlName="timeZone"
        [interfaceOptions]="{ header: 'Zona horaria', cssClass: 'sa-select-alert' }">
        <ion-select-option *ngFor="let tz of timeZones" [value]="tz">
          {{ tz }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item class="custom-input" lines="none">
      <ion-select
        label="Moneda"
        interface="alert"
        formControlName="currency"
        [interfaceOptions]="{ header: 'Moneda', cssClass: 'sa-select-alert' }">
        <ion-select-option *ngFor="let cur of currencies" [value]="cur">
          {{ cur }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <p class="hint">Al cambiar el país se sugieren zona y moneda; puedes ajustarlas después.</p>

    <ion-button mode="md" type="submit" expand="block" [disabled]="form.invalid">
      {{ ruta ? 'Actualizar ruta' : 'Agregar ruta' }}
      <ion-icon slot="end" name="checkmark-circle-outline"></ion-icon>
    </ion-button>
  </form>
</ion-content>
