<app-header [title]="ruta ? 'Editar ruta' : 'Agregar ruta'" [isModal]="true" />

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <custom-input [control]="form.controls.nombre" type="text" label="Nombre" autocomplete="off" />

    <ion-item class="custom-input" lines="none">
      <ion-select label="País" interface="popover" formControlName="pais">
        <ion-select-option *ngFor="let country of countries" [value]="country">
          {{ country }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <custom-input [control]="form.controls.ciudad" type="text" label="Ciudad" autocomplete="off" />

    <ion-item class="custom-input" lines="none">
      <ion-toggle [enableOnOffLabels]="true" formControlName="autoOpen">
        Apertura de caja automática
      </ion-toggle>
    </ion-item>

    <ion-item class="custom-input derived-field" lines="none">
      <ion-label>
        <p>Zona horaria</p>
        <h3>{{ form.controls.timeZone.value || '—' }}</h3>
      </ion-label>
    </ion-item>

    <ion-item class="custom-input derived-field" lines="none">
      <ion-label>
        <p>Moneda</p>
        <h3>{{ form.controls.currency.value || '—' }}</h3>
      </ion-label>
    </ion-item>

    <ion-button mode="md" type="submit" expand="block" [disabled]="form.invalid">
      {{ ruta ? 'Actualizar ruta' : 'Agregar ruta' }}
      <ion-icon slot="end" name="checkmark-circle-outline"></ion-icon>
    </ion-button>
  </form>
</ion-content>
