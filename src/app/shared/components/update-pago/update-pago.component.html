<app-header title="Actualizar Pago" [isModal]="true" />

<ion-content class="ion-padding">

  <form [formGroup]="form" (ngSubmit)="updatePago()">
    <custom-input
      [control]="form.controls.monto"
      type="text"
      label="Monto"
      (ionInput)="setNumberInput()"
    />
    <ion-button type="submit" expand="block" mode="md" [disabled]="form.invalid">
      Actualizar
    </ion-button>

    <ion-button
      type="button"
      expand="block"
      mode="md"
      fill="outline"
      color="danger"
      class="ion-margin-top"
      (click)="confirmDelete()"
    >
      Eliminar pago
    </ion-button>
  </form>

</ion-content>
