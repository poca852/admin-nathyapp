<app-header title="Actualizar cliente" [isModal]="true" />

<ion-content class="ion-padding">
  <div class="form-hero">
    <div class="form-hero-icon">
      <ion-icon name="create-outline"></ion-icon>
    </div>
    <div class="form-hero-text">
      <h2>Editar cliente</h2>
      <p>Actualiza identidad, contacto y fotos del expediente.</p>
    </div>
  </div>

  <form class="cliente-form" (ngSubmit)="updateCliente()" [formGroup]="form">
    <section class="form-section">
      <div class="section-title">
        <ion-icon name="id-card-outline"></ion-icon>
        <span>Identidad</span>
      </div>

      <custom-input
        [control]="form.controls.nombre"
        type="text"
        label="Nombre"
        icon="person-outline"
        autocomplete="name"
      />

      <custom-input
        [control]="form.controls.alias"
        type="text"
        label="Alias"
        icon="pricetag-outline"
        autocomplete="off"
      />

      <custom-input
        [control]="form.controls.dpi"
        type="text"
        label="Documento"
        icon="card-outline"
        autocomplete="off"
      />
    </section>

    <section class="form-section">
      <div class="section-title">
        <ion-icon name="call-outline"></ion-icon>
        <span>Contacto y ubicación</span>
      </div>

      <custom-input
        [control]="form.controls.telefono"
        type="tel"
        label="Teléfono"
        icon="call-outline"
        autocomplete="tel"
      />

      <custom-input
        [control]="form.controls.ciudad"
        type="text"
        label="Ciudad"
        icon="business-outline"
        autocomplete="address-level2"
      />

      <custom-input
        [control]="form.controls.direccion"
        type="text"
        label="Dirección"
        icon="home-outline"
        autocomplete="street-address"
      />
    </section>

    <section class="form-section">
      <div class="section-title">
        <ion-icon name="images-outline"></ion-icon>
        <span>Documentos</span>
      </div>

      <div class="fotos">
        <button type="button" class="foto" (click)="takePicture('document_image')">
          <ion-img
            *ngIf="imagesCliente.document_image"
            [src]="imagesCliente.document_image"
          ></ion-img>
          <ion-icon
            name="document-attach-outline"
            *ngIf="!imagesCliente.document_image"
          ></ion-icon>
          <span>Documento</span>
        </button>

        <button type="button" class="foto" (click)="takePicture('business_image')">
          <ion-img
            *ngIf="imagesCliente.business_image"
            [src]="imagesCliente.business_image"
          ></ion-img>
          <ion-icon
            name="storefront-outline"
            *ngIf="!imagesCliente.business_image"
          ></ion-icon>
          <span>Negocio</span>
        </button>

        <button type="button" class="foto" (click)="takePicture('house_image')">
          <ion-img
            *ngIf="imagesCliente.house_image"
            [src]="imagesCliente.house_image"
          ></ion-img>
          <ion-icon
            name="home-outline"
            *ngIf="!imagesCliente.house_image"
          ></ion-icon>
          <span>Casa</span>
        </button>
      </div>
    </section>

    <ion-button
      mode="md"
      type="submit"
      expand="block"
      class="submit-btn"
      [disabled]="form.invalid || submitting"
    >
      Guardar cambios
      <ion-icon slot="end" name="checkmark-circle-outline"></ion-icon>
    </ion-button>
  </form>
</ion-content>
