<app-header [title]="title" [isModal]="true" />

<ion-content class="ion-padding">

  <form [formGroup]="form" (ngSubmit)="submit()">

    @if (mode === 'perdonar') {
      <ion-item lines="none">
        <ion-label>
          <p>Mora adeudada</p>
          <h2>{{ (credito.mora_adeudada || 0) | money }}</h2>
        </ion-label>
      </ion-item>
    }

    @if (mode === 'aplicar' && credito.moraSugerida) {
      <ion-item lines="none">
        <ion-label>
          <p>Mora sugerida</p>
          <h2>{{ credito.moraSugerida | money }}</h2>
        </ion-label>
      </ion-item>
    }

    <custom-input
      [control]="form.controls.monto"
      type="number"
      label="Monto"
    />

    <custom-input
      [control]="form.controls.motivo"
      type="text"
      label="Motivo (opcional)"
    />

    <ion-button type="submit" expand="block" mode="md" [disabled]="form.invalid">
      {{ submitLabel }}
    </ion-button>

  </form>

</ion-content>
