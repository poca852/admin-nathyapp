<div class="alert-shell" [attr.data-severity]="severity">
  <div class="alert-card">
    <div class="alert-hero">
      <div class="alert-icon-wrap">
        <ion-icon [name]="iconName"></ion-icon>
      </div>
      <span class="alert-type">{{ typeLabel }}</span>
      <h1>{{ announcement.title }}</h1>
      <p *ngIf="showQueue" class="alert-queue">
        Aviso {{ queueIndex }} de {{ queueTotal }}
      </p>
    </div>

    <div class="alert-body">
      <ng-container *ngFor="let block of bodyBlocks">
        <p *ngIf="block.type === 'p'" class="alert-paragraph">{{ block.text }}</p>
        <ul *ngIf="block.type === 'ul'" class="alert-list">
          <li *ngFor="let item of block.items">{{ item }}</li>
        </ul>
      </ng-container>
    </div>

    <div class="alert-actions">
      <ion-button
        expand="block"
        mode="md"
        class="alert-primary"
        [disabled]="busy"
        (click)="onPrimary()">
        <ion-icon
          slot="start"
          [name]="announcement.requiresAck ? 'checkmark-done-outline' : 'close-outline'">
        </ion-icon>
        {{ primaryLabel }}
      </ion-button>
    </div>
  </div>
</div>
