<ion-menu contentId="menu-content" menuId="menu-content" side="start">

  <app-header [title]="menuTitle()" />

  <ion-content class="ion-text-center">

    <ion-button
      expand="block"
      fill="clear"
      size="large"
      class="menu-user-btn"
      (click)="updateUser()">
      {{ user().username | titlecase }}
      <ion-icon slot="end" name="pencil"></ion-icon>
    </ion-button>

    <ion-menu-toggle auto-hide="false" *ngFor="let page of menuPages()">
      <ion-item
        [ngClass]="{'active': isActive(page.url)}"
        [routerLink]="page.url"
        routerDirection="root"
        detail>
        <ion-icon slot="start" [name]="page.icon"></ion-icon>
        <ion-label>{{ page.title }}</ion-label>
      </ion-item>
    </ion-menu-toggle>

  </ion-content>

  <ion-footer class="ion-no-border safe-p-bottom">
    <ion-menu-toggle auto-hide="false">
      <ion-item lines="none" (click)="signOut()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        <ion-label>Cerrar Sesión</ion-label>
      </ion-item>
    </ion-menu-toggle>
  </ion-footer>
</ion-menu>

<ion-router-outlet id="menu-content" main></ion-router-outlet>
