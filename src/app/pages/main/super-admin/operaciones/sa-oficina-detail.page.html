<app-header
  title="Oficina"
  [backButton]="'/main/super-admin/operaciones'" />

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="!movimiento()" class="sa-empty">
    <ion-icon name="briefcase-outline"></ion-icon>
    <p>No hay datos del movimiento. Vuelve a la lista e intenta de nuevo.</p>
  </div>

  <ng-container *ngIf="movimiento() as m">
    <section class="sa-hero">
      <div class="sa-hero-icon">
        <ion-icon name="briefcase-outline"></ion-icon>
      </div>
      <div class="sa-hero-copy">
        <h1>{{ m.valor | money }}</h1>
        <p>{{ titulo() }} · {{ getSubTipoLabel(m.subTipo) }}</p>
      </div>
    </section>

    <div class="sa-actions">
      <button type="button" class="sa-action-card" (click)="editMovimiento()">
        <div class="icon">
          <ion-icon name="create-outline"></ion-icon>
        </div>
        <div class="copy">
          <h2>Editar movimiento</h2>
          <p>Monto, concepto y detalles (cualquier fecha)</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </button>
    </div>
  </ng-container>
</ion-content>
