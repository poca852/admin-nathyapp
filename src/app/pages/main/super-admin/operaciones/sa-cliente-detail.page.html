<app-header
  title="Cliente"
  [backButton]="'/main/super-admin/operaciones'" />

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="!cliente()" class="sa-empty">
    <ion-icon name="person-outline"></ion-icon>
    <p>No hay datos del cliente. Vuelve a la lista e intenta de nuevo.</p>
  </div>

  <ng-container *ngIf="cliente() as c">
    <section class="sa-hero">
      <div class="sa-hero-icon">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="sa-hero-copy">
        <h1>{{ titulo() }}</h1>
        <p>{{ c.telefono || 'Sin teléfono' }} · DPI {{ c.dpi || '—' }}</p>
        <ion-badge [color]="isOperativo() ? 'success' : 'medium'" mode="md">
          {{ isOperativo() ? 'Activo' : 'Desactivado' }}
        </ion-badge>
        <ion-badge
          class="ion-margin-start"
          [color]="c.status ? 'primary' : 'medium'"
          mode="md">
          {{ c.status ? 'Con crédito' : 'Sin crédito' }}
        </ion-badge>
      </div>
    </section>

    <div class="sa-summary">
      <div class="item">
        <span>Alias</span>
        <strong>{{ c.alias || '—' }}</strong>
      </div>
      <div class="item">
        <span>Dirección</span>
        <strong>{{ c.direccion || '—' }}</strong>
      </div>
    </div>

    <div class="sa-actions">
      <button type="button" class="sa-action-card" (click)="editCliente()">
        <div class="icon">
          <ion-icon name="create-outline"></ion-icon>
        </div>
        <div class="copy">
          <h2>Editar cliente</h2>
          <p>Datos de contacto y ubicación</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </button>

      <button type="button" class="sa-action-card" (click)="confirmToggleState()">
        <div class="icon" [class.danger]="isOperativo()">
          <ion-icon [name]="isOperativo() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </div>
        <div class="copy">
          <h2>{{ isOperativo() ? 'Desactivar cliente' : 'Activar cliente' }}</h2>
          <p>
            {{ isOperativo()
              ? 'Ocultarlo en admin y cobrador; conserva historial'
              : 'Volver a mostrarlo como estaba' }}
          </p>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </button>

      <button type="button" class="sa-action-card" (click)="confirmDelete()">
        <div class="icon danger">
          <ion-icon name="trash-outline"></ion-icon>
        </div>
        <div class="copy">
          <h2>Eliminar cliente</h2>
          <p>Borrado permanente; solo si no tiene crédito activo</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </button>
    </div>
  </ng-container>
</ion-content>
