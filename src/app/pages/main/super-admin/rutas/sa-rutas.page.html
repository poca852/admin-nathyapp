<app-header title="Rutas" [showMenu]="true" />

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="loadRutas($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="sa-toolbar">
    <ion-select
      class="sa-filter-select"
      interface="alert"
      placeholder="Todas las empresas"
      [value]="selectedEmpresaId()"
      (ionChange)="onEmpresaChange($event)"
      [interfaceOptions]="{ header: 'Seleccionar empresa', cssClass: 'sa-select-alert' }">
      <ion-select-option [value]="null">Todas</ion-select-option>
      <ion-select-option value="__none__">
        Sin empresa ({{ orphanCount() }})
      </ion-select-option>
      <ion-select-option *ngFor="let e of ctx.empresas()" [value]="e.id">
        {{ e.name }}
      </ion-select-option>
    </ion-select>
    <ion-button fill="solid" aria-label="Nueva ruta" (click)="createRuta()">
      <ion-icon slot="icon-only" name="add-outline"></ion-icon>
    </ion-button>
  </div>

  <ion-searchbar
    class="sa-search"
    debounce="250"
    placeholder="Buscar ruta"
    (ionInput)="onSearch($event)">
  </ion-searchbar>

  <div *ngIf="loading()" class="skeleton-block">
    <ion-skeleton-text animated style="width: 100%; height: 56px; border-radius: 12px;"></ion-skeleton-text>
  </div>

  <div *ngIf="!loading() && loadError()" class="sa-empty">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <p>No se pudieron cargar las rutas</p>
    <ion-button (click)="loadRutas()">Reintentar</ion-button>
  </div>

  <ion-list *ngIf="!loading() && !loadError()">
    <ion-item
      *ngFor="let ruta of filtered(); trackBy: trackById"
      button
      detail
      (click)="openDetail(ruta)">
      <ion-icon
        slot="start"
        name="layers-outline"
        [color]="isOrphan(ruta) ? 'warning' : (ruta.status ? 'success' : 'medium')">
      </ion-icon>
      <ion-label>
        <h2>
          {{ ruta.nombre }}
          <ion-badge *ngIf="isOrphan(ruta)" color="warning" mode="md">Sin empresa</ion-badge>
        </h2>
        <p>
          {{ empresaName(ruta) }} · {{ ruta.ciudad || '—' }}, {{ ruta.pais || '—' }}
          · {{ ruta.status ? 'Abierta' : 'Cerrada' }}
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="!loading() && !loadError() && filtered().length === 0" class="sa-empty">
    <ion-icon name="layers-outline"></ion-icon>
    <p>No hay rutas</p>
  </div>
</ion-content>
